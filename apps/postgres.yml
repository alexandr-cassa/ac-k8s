apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: postgres
  namespace: devops
spec:
  project: default
  source:
    repoURL: https://github.com/alexandr-cassa/ac-k8s.git
    targetRevision: HEAD
    path: postgres
  destination:
    server: https://kubernetes.default.svc
    namespace: app
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true